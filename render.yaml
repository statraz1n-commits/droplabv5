services:
  - type: web
    name: droplab-cs2
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_STEAM_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/droplab.sqlite
    disk:
      name: droplab-storage
      mountPath: /var/data
      sizeGB: 1
